<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Store - Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <!-- Official Vite React Entrypoint for Production and Dev Server -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Standalone Offline Engine for direct File Explorer (file://) double-clicking -->
    <script>
      if (window.location.protocol === 'file:') {
        (function() {
          const PRODUCTS = [
            {
              id: 'mouse',
              name: 'Wireless Mouse',
              price: 799,
              description: 'Ergonomic 2.4GHz wireless optical mouse with smooth tracking and silent clicks.',
              badge: 'Popular'
            },
            {
              id: 'keyboard',
              name: 'Mechanical Keyboard',
              price: 1499,
              description: 'Tactile mechanical keyboard with responsive switches and durable keycaps.',
              badge: 'Top Rated'
            }
          ];

          let cart = [];
          let customerName = '';
          let errors = {};
          let orderConfirmation = null;
          let isSubmitting = false;

          const formatINR = (amt) => '₹' + amt.toLocaleString('en-IN');

          function render() {
            const root = document.getElementById('root');
            if (!root) return;

            const totalItemCount = cart.reduce((cnt, item) => cnt + item.quantity, 0);
            const orderTotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

            let productsHtml = PRODUCTS.map(product => {
              const itemInCart = cart.find(i => i.id === product.id);
              const btnText = itemInCart ? `Add More (${itemInCart.quantity} in cart)` : 'Add to Cart';
              return `
                <article class="product-card" data-testid="product-card-${product.id}">
                  <div class="product-header">
                    <span class="product-badge">${product.badge}</span>
                    <span class="product-price">${formatINR(product.price)}</span>
                  </div>
                  <h3 class="product-name">${product.name}</h3>
                  <p class="product-desc">${product.description}</p>
                  <div class="product-actions">
                    <button
                      type="button"
                      class="btn btn-primary"
                      data-testid="add-to-cart-${product.id}"
                      onclick="window.__store.addToCart('${product.id}')"
                      ${orderConfirmation ? 'disabled' : ''}
                      aria-label="Add ${product.name} to cart"
                    >
                      ${btnText}
                    </button>
                  </div>
                </article>
              `;
            }).join('');

            let cartHtml = '';
            if (cart.length === 0) {
              cartHtml = `
                <div class="empty-cart-state" data-testid="empty-cart-message">
                  <span class="empty-icon" aria-hidden="true">🛍️</span>
                  <p class="empty-cart-text">Your cart is empty.</p>
                  <p class="empty-cart-subtext">Add a product above to start your checkout.</p>
                </div>
              `;
            } else {
              const itemsList = cart.map(item => {
                const lineTotal = item.price * item.quantity;
                return `
                  <div class="cart-item" data-testid="cart-item-${item.id}">
                    <div class="cart-item-details">
                      <span class="cart-item-name">${item.name}</span>
                      <span class="cart-item-unit-price">${formatINR(item.price)} each</span>
                    </div>
                    <div class="cart-item-controls">
                      <div class="quantity-stepper">
                        <button
                          type="button"
                          class="qty-btn"
                          data-testid="qty-decrease-${item.id}"
                          aria-label="Decrease quantity of ${item.name}"
                          ${item.quantity <= 1 || orderConfirmation ? 'disabled' : ''}
                          onclick="window.__store.updateQty('${item.id}', -1)"
                        >−</button>
                        <span class="qty-value" data-testid="qty-value-${item.id}">${item.quantity}</span>
                        <button
                          type="button"
                          class="qty-btn"
                          data-testid="qty-increase-${item.id}"
                          aria-label="Increase quantity of ${item.name}"
                          ${orderConfirmation ? 'disabled' : ''}
                          onclick="window.__store.updateQty('${item.id}', 1)"
                        >+</button>
                      </div>
                      <div class="line-total-wrapper">
                        <span class="line-total-label">Subtotal:</span>
                        <span class="cart-item-line-total" data-testid="line-total-${item.id}">${formatINR(lineTotal)}</span>
                      </div>
                      <button
                        type="button"
                        class="btn-remove"
                        data-testid="remove-${item.id}"
                        ${orderConfirmation ? 'disabled' : ''}
                        onclick="window.__store.removeFromCart('${item.id}')"
                      >Remove</button>
                    </div>
                  </div>
                `;
              }).join('');

              cartHtml = `
                <div class="cart-items-list" data-testid="cart-items-container">
                  ${itemsList}
                  <div class="cart-summary-bar">
                    <span class="cart-total-label">Cart Subtotal:</span>
                    <span class="cart-total-value">${formatINR(orderTotal)}</span>
                  </div>
                </div>
              `;
            }

            let confirmationHtml = '';
            if (orderConfirmation) {
              const confirmedItemsList = orderConfirmation.items.map(item => `
                <li class="confirmed-item-row">
                  <span>${item.name} × ${item.quantity}</span>
                  <span>${formatINR(item.price * item.quantity)}</span>
                </li>
              `).join('');

              confirmationHtml = `
                <section class="confirmation-card" data-testid="order-confirmation" aria-labelledby="confirmation-heading">
                  <div class="confirmation-header">
                    <div class="success-badge-icon" aria-hidden="true">✓</div>
                    <div>
                      <h3 id="confirmation-heading" class="confirmation-title">Order Placed Successfully!</h3>
                      <p class="confirmation-subtitle">Thank you, your order has been received and confirmed.</p>
                    </div>
                  </div>
                  <div class="confirmation-details">
                    <div class="confirmation-row">
                      <span class="detail-label">Order Reference:</span>
                      <strong class="detail-value ref-number" data-testid="order-reference">${orderConfirmation.reference}</strong>
                    </div>
                    <div class="confirmation-row">
                      <span class="detail-label">Customer Name:</span>
                      <strong class="detail-value" data-testid="confirmed-customer-name">${orderConfirmation.customerName}</strong>
                    </div>
                    <div class="confirmation-row">
                      <span class="detail-label">Order Time:</span>
                      <span class="detail-value">${orderConfirmation.placedAt}</span>
                    </div>
                  </div>
                  <div class="confirmation-items-summary">
                    <h4 class="confirmed-items-title">Items Ordered</h4>
                    <ul class="confirmed-items-list">${confirmedItemsList}</ul>
                    <div class="confirmation-total-row">
                      <span>Total Paid:</span>
                      <strong class="confirmed-total-amount" data-testid="confirmed-total">${formatINR(orderConfirmation.total)}</strong>
                    </div>
                  </div>
                  <div class="confirmation-notice">
                    ℹ️ This order is permanently confirmed. No duplicate charges will occur.
                  </div>
                </section>
              `;
            }

            root.innerHTML = `
              <div class="app-container">
                <header class="store-header">
                  <div class="header-content">
                    <div class="logo-group">
                      <span class="logo-icon" aria-hidden="true">🛒</span>
                      <div>
                        <h1 class="store-title">Mini Store</h1>
                        <p class="store-subtitle">Fast & Reliable Checkout</p>
                      </div>
                    </div>
                    <span class="catalog-pill">2 Products Available</span>
                  </div>
                </header>

                <main class="main-layout">
                  <section class="catalog-and-cart">
                    <section class="card-section" aria-labelledby="products-heading">
                      <h2 id="products-heading" class="section-title">Products</h2>
                      <div class="product-grid">${productsHtml}</div>
                    </section>

                    <section class="card-section" aria-labelledby="cart-heading">
                      <div class="cart-title-row">
                        <h2 id="cart-heading" class="section-title">Shopping Cart</h2>
                        <span class="cart-count-badge" data-testid="cart-item-count">${totalItemCount} items</span>
                      </div>
                      ${cartHtml}
                    </section>
                  </section>

                  <section class="checkout-and-confirmation">
                    <div class="checkout-card">
                      <h2 class="section-title">Checkout Details</h2>
                      ${errors.cart ? `
                        <div class="alert alert-error" role="alert" data-testid="cart-error">
                          <span class="alert-icon" aria-hidden="true">⚠️</span>
                          <span>${errors.cart}</span>
                        </div>
                      ` : ''}
                      <form onsubmit="window.__store.placeOrder(event)" noValidate>
                        <div class="form-group">
                          <label for="customer-name" class="form-label">
                            Customer Name <span class="required-indicator">*</span>
                          </label>
                          <input
                            id="customer-name"
                            type="text"
                            class="form-input ${errors.name ? 'input-error' : ''}"
                            data-testid="customer-name-input"
                            placeholder="Enter full name"
                            value="${customerName}"
                            oninput="window.__store.setName(this.value)"
                            ${orderConfirmation ? 'disabled' : ''}
                          />
                          ${errors.name ? `
                            <p id="name-error-msg" class="error-message" role="alert" data-testid="name-error">
                              ${errors.name}
                            </p>
                          ` : ''}
                        </div>

                        <div class="order-summary-box">
                          <div class="summary-row">
                            <span>Selected Items</span>
                            <span>${totalItemCount}</span>
                          </div>
                          <div class="summary-row">
                            <span>Delivery</span>
                            <span class="free-tag">FREE</span>
                          </div>
                          <div class="summary-divider"></div>
                          <div class="summary-row total-row">
                            <span>Order Total:</span>
                            <span class="total-amount" data-testid="order-total">${formatINR(orderTotal)}</span>
                          </div>
                        </div>

                        <button
                          type="submit"
                          class="btn btn-checkout"
                          data-testid="place-order-button"
                          ${orderConfirmation || isSubmitting ? 'disabled' : ''}
                        >
                          ${orderConfirmation ? 'Order Confirmed ✓' : (isSubmitting ? 'Processing Order...' : 'Place Order')}
                        </button>
                      </form>
                    </div>

                    ${confirmationHtml}
                  </section>
                </main>

                <footer class="store-footer">
                  <p>Mini Checkout Store • Beginner-Friendly React & Playwright Demonstration</p>
                </footer>
              </div>
            `;
          }

          window.__store = {
            addToCart(id) {
              if (orderConfirmation) return;
              const prod = PRODUCTS.find(p => p.id === id);
              if (!prod) return;
              const existing = cart.find(i => i.id === id);
              if (existing) {
                existing.quantity += 1;
              } else {
                cart.push({ id: prod.id, name: prod.name, price: prod.price, quantity: 1 });
              }
              delete errors.cart;
              render();
            },
            removeFromCart(id) {
              if (orderConfirmation) return;
              cart = cart.filter(i => i.id !== id);
              render();
            },
            updateQty(id, delta) {
              if (orderConfirmation) return;
              const item = cart.find(i => i.id === id);
              if (!item) return;
              const newQty = item.quantity + delta;
              if (newQty < 1) return;
              item.quantity = newQty;
              render();
            },
            setName(val) {
              customerName = val;
              if (val.trim()) {
                delete errors.name;
              }
            },
            placeOrder(e) {
              e.preventDefault();
              if (orderConfirmation || isSubmitting) return;
              isSubmitting = true;

              const validationErrors = {};
              const trimmed = customerName.trim();
              if (cart.length === 0) {
                validationErrors.cart = 'Your cart is empty. Please add at least one product to proceed.';
              }
              if (!trimmed) {
                validationErrors.name = 'Please enter your customer name.';
              }

              if (Object.keys(validationErrors).length > 0) {
                errors = validationErrors;
                isSubmitting = false;
                render();
                return;
              }

              errors = {};
              const timestamp = Date.now().toString(36).toUpperCase();
              const randomPart = Math.random().toString(36).substring(2, 6).toUpperCase();
              const ref = 'ORD-' + timestamp + '-' + randomPart;

              orderConfirmation = {
                reference: ref,
                customerName: trimmed,
                items: cart.map(i => ({ ...i })),
                total: cart.reduce((sum, i) => sum + i.price * i.quantity, 0),
                placedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
              };

              isSubmitting = false;
              render();
            }
          };

          document.addEventListener('DOMContentLoaded', render);
          if (document.readyState !== 'loading') render();
        })();
      }
    </script>
  </body>
</html>
