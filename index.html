<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Store - Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles.css" />
    <style>
      :root {
        --color-bg: #f8fafc;
        --color-card-bg: #ffffff;
        --color-text-main: #0f172a;
        --color-text-muted: #64748b;
        --color-primary: #2563eb;
        --color-primary-hover: #1d4ed8;
        --color-primary-light: #eff6ff;
        --color-success: #15803d;
        --color-success-bg: #f0fdf4;
        --color-success-border: #bbf7d0;
        --color-error: #b91c1c;
        --color-error-bg: #fef2f2;
        --color-error-border: #fecaca;
        --color-border: #e2e8f0;
        --color-border-focus: #3b82f6;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 14px;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--color-bg);
        color: var(--color-text-main);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .app-container { min-height: 100vh; display: flex; flex-direction: column; }
      .store-header { background-color: var(--color-card-bg); border-bottom: 1px solid var(--color-border); padding: 1rem 1.5rem; box-shadow: var(--shadow-sm); }
      .header-content { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
      .logo-group { display: flex; align-items: center; gap: 0.75rem; }
      .logo-icon { font-size: 1.75rem; }
      .store-title { font-size: 1.35rem; font-weight: 700; color: var(--color-text-main); letter-spacing: -0.02em; }
      .store-subtitle { font-size: 0.85rem; color: var(--color-text-muted); }
      .catalog-pill { font-size: 0.8rem; font-weight: 600; color: var(--color-primary); background: var(--color-primary-light); padding: 0.3rem 0.75rem; border-radius: 999px; border: 1px solid #bfdbfe; }
      .main-layout { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; display: grid; grid-template-columns: 1.25fr 1fr; gap: 2rem; align-items: start; flex: 1; width: 100%; }
      @media (max-width: 860px) { .main-layout { grid-template-columns: 1fr; margin: 1.25rem auto; gap: 1.5rem; } }
      .catalog-and-cart, .checkout-and-confirmation { display: flex; flex-direction: column; gap: 1.75rem; }
      .card-section, .checkout-card, .confirmation-card { background-color: var(--color-card-bg); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 1.5rem; box-shadow: var(--shadow-md); }
      .section-title { font-size: 1.2rem; font-weight: 700; color: var(--color-text-main); margin-bottom: 1rem; }
      .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      @media (max-width: 580px) { .product-grid { grid-template-columns: 1fr; } }
      .product-card { display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 1.15rem; background-color: #fafbfc; }
      .product-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
      .product-badge { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; color: #0369a1; background: #e0f2fe; padding: 0.2rem 0.5rem; border-radius: 4px; }
      .product-price { font-size: 1.15rem; font-weight: 700; color: var(--color-text-main); }
      .product-name { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--color-text-main); }
      .product-desc { font-size: 0.85rem; color: var(--color-text-muted); margin-bottom: 1rem; line-height: 1.4; flex-grow: 1; }
      .btn { display: inline-flex; align-items: center; justify-content: center; font-family: inherit; font-size: 0.9rem; font-weight: 600; border-radius: var(--radius-sm); padding: 0.65rem 1rem; border: none; cursor: pointer; transition: background-color 0.15s ease, opacity 0.15s ease; width: 100%; }
      .btn:disabled { opacity: 0.55; cursor: not-allowed; }
      .btn-primary { background-color: var(--color-primary); color: #ffffff; }
      .btn-primary:hover:not(:disabled) { background-color: var(--color-primary-hover); }
      .btn-checkout { background-color: #0f172a; color: #ffffff; padding: 0.85rem 1.25rem; font-size: 1rem; margin-top: 1.25rem; }
      .btn-checkout:hover:not(:disabled) { background-color: #1e293b; }
      .cart-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
      .cart-title-row .section-title { margin-bottom: 0; }
      .cart-count-badge { font-size: 0.8rem; background: var(--color-border); color: var(--color-text-main); padding: 0.2rem 0.6rem; border-radius: 999px; font-weight: 600; }
      .empty-cart-state { text-align: center; padding: 2.25rem 1rem; border: 1px dashed var(--color-border); border-radius: var(--radius-md); background-color: #fafbfc; }
      .empty-icon { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }
      .empty-cart-text { font-size: 0.95rem; font-weight: 600; color: var(--color-text-main); }
      .empty-cart-subtext { font-size: 0.82rem; color: var(--color-text-muted); margin-top: 0.25rem; }
      .cart-items-list { display: flex; flex-direction: column; gap: 0.85rem; }
      .cart-item { border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 0.85rem 1rem; display: flex; flex-direction: column; gap: 0.65rem; background: #ffffff; }
      .cart-item-details { display: flex; justify-content: space-between; align-items: baseline; }
      .cart-item-name { font-weight: 600; font-size: 0.95rem; color: var(--color-text-main); }
      .cart-item-unit-price { font-size: 0.85rem; color: var(--color-text-muted); }
      .cart-item-controls { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
      .quantity-stepper { display: inline-flex; align-items: center; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: #ffffff; overflow: hidden; }
      .qty-btn { background: #f1f5f9; border: none; width: 32px; height: 32px; font-size: 1.1rem; font-weight: 600; color: var(--color-text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; }
      .qty-btn:hover:not(:disabled) { background: #e2e8f0; }
      .qty-btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .qty-value { padding: 0 0.75rem; font-size: 0.95rem; font-weight: 600; min-width: 2rem; text-align: center; }
      .line-total-wrapper { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; }
      .line-total-label { color: var(--color-text-muted); font-size: 0.8rem; }
      .cart-item-line-total { font-weight: 700; color: var(--color-text-main); font-size: 0.95rem; }
      .btn-remove { background: transparent; border: none; color: #dc2626; font-size: 0.8rem; font-weight: 600; cursor: pointer; padding: 0.25rem 0.5rem; text-decoration: underline; }
      .cart-summary-bar { display: flex; justify-content: space-between; align-items: center; padding-top: 0.75rem; border-top: 1px dashed var(--color-border); margin-top: 0.25rem; }
      .cart-total-label { font-size: 0.9rem; color: var(--color-text-muted); font-weight: 500; }
      .cart-total-value { font-size: 1.15rem; font-weight: 700; color: var(--color-text-main); }
      .form-group { margin-bottom: 1.25rem; }
      .form-label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--color-text-main); }
      .required-indicator { color: var(--color-error); }
      .form-input { width: 100%; padding: 0.7rem 0.85rem; font-size: 0.95rem; font-family: inherit; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: #ffffff; color: var(--color-text-main); transition: border-color 0.15s ease, box-shadow 0.15s ease; }
      .form-input:focus { outline: none; border-color: var(--color-border-focus); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
      .form-input.input-error { border-color: var(--color-error); background-color: #fffaf9; }
      .error-message { color: var(--color-error); font-size: 0.82rem; font-weight: 500; margin-top: 0.4rem; display: flex; align-items: center; gap: 0.3rem; }
      .alert { display: flex; align-items: center; gap: 0.6rem; padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1rem; font-size: 0.88rem; font-weight: 500; }
      .alert-error { background-color: var(--color-error-bg); border: 1px solid var(--color-error-border); color: var(--color-error); }
      .order-summary-box { background-color: #f8fafc; border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
      .summary-row { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--color-text-muted); }
      .summary-divider { border-top: 1px solid var(--color-border); margin: 0.25rem 0; }
      .free-tag { color: var(--color-success); font-weight: 600; }
      .summary-row.total-row { font-size: 1.15rem; font-weight: 700; color: var(--color-text-main); }
      .total-amount { color: var(--color-primary); }
      .confirmation-card { border: 2px solid var(--color-success-border); background-color: var(--color-success-bg); }
      .confirmation-header { display: flex; align-items: flex-start; gap: 0.75rem; margin-bottom: 1.25rem; }
      .success-badge-icon { width: 36px; height: 36px; background-color: var(--color-success); color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: 700; flex-shrink: 0; }
      .confirmation-title { font-size: 1.15rem; font-weight: 700; color: #14532d; }
      .confirmation-subtitle { font-size: 0.85rem; color: #166534; }
      .confirmation-details { background-color: #ffffff; border: 1px solid #dcfce7; border-radius: var(--radius-md); padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
      .confirmation-row { display: flex; justify-content: space-between; font-size: 0.88rem; }
      .detail-label { color: var(--color-text-muted); }
      .detail-value { color: var(--color-text-main); }
      .ref-number { font-family: monospace; font-size: 0.95rem; color: #15803d; background: #f0fdf4; padding: 0.15rem 0.4rem; border-radius: 4px; }
      .confirmation-items-summary { background-color: #ffffff; border: 1px solid #dcfce7; border-radius: var(--radius-md); padding: 1rem; }
      .confirmed-items-title { font-size: 0.9rem; font-weight: 600; color: var(--color-text-main); margin-bottom: 0.5rem; }
      .confirmed-items-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.88rem; color: #334155; margin-bottom: 0.75rem; }
      .confirmed-item-row { display: flex; justify-content: space-between; }
      .confirmation-total-row { display: flex; justify-content: space-between; border-top: 1px dashed var(--color-border); padding-top: 0.6rem; font-size: 1.05rem; }
      .confirmed-total-amount { color: #15803d; font-weight: 700; }
      .confirmation-notice { font-size: 0.8rem; color: #166534; margin-top: 0.85rem; text-align: center; }
      .store-footer { margin-top: auto; border-top: 1px solid var(--color-border); background-color: var(--color-card-bg); padding: 1.25rem 1rem; text-align: center; font-size: 0.82rem; color: var(--color-text-muted); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Standalone Offline Engine for direct File Explorer (file://) access -->
    <script>
      if (window.location.protocol === 'file:') {
        (function() {
          const PRODUCTS = [
            {
              id: 'mouse',
              name: 'Wireless Mouse',
              price: 799,
              description: 'Ergonomic 2.4GHz wireless optical mouse with smooth tracking and silent clicks.',
              badge: 'Popular'
            },
            {
              id: 'keyboard',
              name: 'Mechanical Keyboard',
              price: 1499,
              description: 'Tactile mechanical keyboard with responsive switches and durable keycaps.',
              badge: 'Top Rated'
            }
          ];

          let cart = [];
          let customerName = '';
          let errors = {};
          let orderConfirmation = null;
          let isSubmitting = false;

          const formatINR = (amt) => '₹' + amt.toLocaleString('en-IN');

          function render() {
            const root = document.getElementById('root');
            if (!root) return;

            const totalItemCount = cart.reduce((cnt, item) => cnt + item.quantity, 0);
            const orderTotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

            let productsHtml = PRODUCTS.map(product => {
              const itemInCart = cart.find(i => i.id === product.id);
              const btnText = itemInCart ? `Add More (${itemInCart.quantity} in cart)` : 'Add to Cart';
              return `
                <article class="product-card" data-testid="product-card-${product.id}">
                  <div class="product-header">
                    <span class="product-badge">${product.badge}</span>
                    <span class="product-price">${formatINR(product.price)}</span>
                  </div>
                  <h3 class="product-name">${product.name}</h3>
                  <p class="product-desc">${product.description}</p>
                  <div class="product-actions">
                    <button
                      type="button"
                      class="btn btn-primary"
                      data-testid="add-to-cart-${product.id}"
                      onclick="window.__store.addToCart('${product.id}')"
                      ${orderConfirmation ? 'disabled' : ''}
                      aria-label="Add ${product.name} to cart"
                    >
                      ${btnText}
                    </button>
                  </div>
                </article>
              `;
            }).join('');

            let cartHtml = '';
            if (cart.length === 0) {
              cartHtml = `
                <div class="empty-cart-state" data-testid="empty-cart-message">
                  <span class="empty-icon" aria-hidden="true">🛍️</span>
                  <p class="empty-cart-text">Your cart is empty.</p>
                  <p class="empty-cart-subtext">Add a product above to start your checkout.</p>
                </div>
              `;
            } else {
              const itemsList = cart.map(item => {
                const lineTotal = item.price * item.quantity;
                return `
                  <div class="cart-item" data-testid="cart-item-${item.id}">
                    <div class="cart-item-details">
                      <span class="cart-item-name">${item.name}</span>
                      <span class="cart-item-unit-price">${formatINR(item.price)} each</span>
                    </div>
                    <div class="cart-item-controls">
                      <div class="quantity-stepper">
                        <button
                          type="button"
                          class="qty-btn"
                          data-testid="qty-decrease-${item.id}"
                          aria-label="Decrease quantity of ${item.name}"
                          ${item.quantity <= 1 || orderConfirmation ? 'disabled' : ''}
                          onclick="window.__store.updateQty('${item.id}', -1)"
                        >−</button>
                        <span class="qty-value" data-testid="qty-value-${item.id}">${item.quantity}</span>
                        <button
                          type="button"
                          class="qty-btn"
                          data-testid="qty-increase-${item.id}"
                          aria-label="Increase quantity of ${item.name}"
                          ${orderConfirmation ? 'disabled' : ''}
                          onclick="window.__store.updateQty('${item.id}', 1)"
                        >+</button>
                      </div>
                      <div class="line-total-wrapper">
                        <span class="line-total-label">Subtotal:</span>
                        <span class="cart-item-line-total" data-testid="line-total-${item.id}">${formatINR(lineTotal)}</span>
                      </div>
                      <button
                        type="button"
                        class="btn-remove"
                        data-testid="remove-${item.id}"
                        ${orderConfirmation ? 'disabled' : ''}
                        onclick="window.__store.removeFromCart('${item.id}')"
                      >Remove</button>
                    </div>
                  </div>
                `;
              }).join('');

              cartHtml = `
                <div class="cart-items-list" data-testid="cart-items-container">
                  ${itemsList}
                  <div class="cart-summary-bar">
                    <span class="cart-total-label">Cart Subtotal:</span>
                    <span class="cart-total-value">${formatINR(orderTotal)}</span>
                  </div>
                </div>
              `;
            }

            let confirmationHtml = '';
            if (orderConfirmation) {
              const confirmedItemsList = orderConfirmation.items.map(item => `
                <li class="confirmed-item-row">
                  <span>${item.name} × ${item.quantity}</span>
                  <span>${formatINR(item.price * item.quantity)}</span>
                </li>
              `).join('');

              confirmationHtml = `
                <section class="confirmation-card" data-testid="order-confirmation" aria-labelledby="confirmation-heading">
                  <div class="confirmation-header">
                    <div class="success-badge-icon" aria-hidden="true">✓</div>
                    <div>
                      <h3 id="confirmation-heading" class="confirmation-title">Order Placed Successfully!</h3>
                      <p class="confirmation-subtitle">Thank you, your order has been received and confirmed.</p>
                    </div>
                  </div>
                  <div class="confirmation-details">
                    <div class="confirmation-row">
                      <span class="detail-label">Order Reference:</span>
                      <strong class="detail-value ref-number" data-testid="order-reference">${orderConfirmation.reference}</strong>
                    </div>
                    <div class="confirmation-row">
                      <span class="detail-label">Customer Name:</span>
                      <strong class="detail-value" data-testid="confirmed-customer-name">${orderConfirmation.customerName}</strong>
                    </div>
                    <div class="confirmation-row">
                      <span class="detail-label">Order Time:</span>
                      <span class="detail-value">${orderConfirmation.placedAt}</span>
                    </div>
                  </div>
                  <div class="confirmation-items-summary">
                    <h4 class="confirmed-items-title">Items Ordered</h4>
                    <ul class="confirmed-items-list">${confirmedItemsList}</ul>
                    <div class="confirmation-total-row">
                      <span>Total Paid:</span>
                      <strong class="confirmed-total-amount" data-testid="confirmed-total">${formatINR(orderConfirmation.total)}</strong>
                    </div>
                  </div>
                  <div class="confirmation-notice">
                    ℹ️ This order is permanently confirmed. No duplicate charges will occur.
                  </div>
                </section>
              `;
            }

            root.innerHTML = `
              <div class="app-container">
                <header class="store-header">
                  <div class="header-content">
                    <div class="logo-group">
                      <span class="logo-icon" aria-hidden="true">🛒</span>
                      <div>
                        <h1 class="store-title">Mini Store</h1>
                        <p class="store-subtitle">Fast & Reliable Checkout</p>
                      </div>
                    </div>
                    <span class="catalog-pill">2 Products Available</span>
                  </div>
                </header>

                <main class="main-layout">
                  <section class="catalog-and-cart">
                    <section class="card-section" aria-labelledby="products-heading">
                      <h2 id="products-heading" class="section-title">Products</h2>
                      <div class="product-grid">${productsHtml}</div>
                    </section>

                    <section class="card-section" aria-labelledby="cart-heading">
                      <div class="cart-title-row">
                        <h2 id="cart-heading" class="section-title">Shopping Cart</h2>
                        <span class="cart-count-badge" data-testid="cart-item-count">${totalItemCount} items</span>
                      </div>
                      ${cartHtml}
                    </section>
                  </section>

                  <section class="checkout-and-confirmation">
                    <div class="checkout-card">
                      <h2 class="section-title">Checkout Details</h2>
                      ${errors.cart ? `
                        <div class="alert alert-error" role="alert" data-testid="cart-error">
                          <span class="alert-icon" aria-hidden="true">⚠️</span>
                          <span>${errors.cart}</span>
                        </div>
                      ` : ''}
                      <form onsubmit="window.__store.placeOrder(event)" noValidate>
                        <div class="form-group">
                          <label for="customer-name" class="form-label">
                            Customer Name <span class="required-indicator">*</span>
                          </label>
                          <input
                            id="customer-name"
                            type="text"
                            class="form-input ${errors.name ? 'input-error' : ''}"
                            data-testid="customer-name-input"
                            placeholder="Enter full name"
                            value="${customerName}"
                            oninput="window.__store.setName(this.value)"
                            ${orderConfirmation ? 'disabled' : ''}
                          />
                          ${errors.name ? `
                            <p id="name-error-msg" class="error-message" role="alert" data-testid="name-error">
                              ${errors.name}
                            </p>
                          ` : ''}
                        </div>

                        <div class="order-summary-box">
                          <div class="summary-row">
                            <span>Selected Items</span>
                            <span>${totalItemCount}</span>
                          </div>
                          <div class="summary-row">
                            <span>Delivery</span>
                            <span class="free-tag">FREE</span>
                          </div>
                          <div class="summary-divider"></div>
                          <div class="summary-row total-row">
                            <span>Order Total:</span>
                            <span class="total-amount" data-testid="order-total">${formatINR(orderTotal)}</span>
                          </div>
                        </div>

                        <button
                          type="submit"
                          class="btn btn-checkout"
                          data-testid="place-order-button"
                          ${orderConfirmation || isSubmitting ? 'disabled' : ''}
                        >
                          ${orderConfirmation ? 'Order Confirmed ✓' : (isSubmitting ? 'Processing Order...' : 'Place Order')}
                        </button>
                      </form>
                    </div>

                    ${confirmationHtml}
                  </section>
                </main>

                <footer class="store-footer">
                  <p>Mini Checkout Store • Beginner-Friendly React & Playwright Demonstration</p>
                </footer>
              </div>
            `;
          }

          window.__store = {
            addToCart(id) {
              if (orderConfirmation) return;
              const prod = PRODUCTS.find(p => p.id === id);
              if (!prod) return;
              const existing = cart.find(i => i.id === id);
              if (existing) {
                existing.quantity += 1;
              } else {
                cart.push({ id: prod.id, name: prod.name, price: prod.price, quantity: 1 });
              }
              delete errors.cart;
              render();
            },
            removeFromCart(id) {
              if (orderConfirmation) return;
              cart = cart.filter(i => i.id !== id);
              render();
            },
            updateQty(id, delta) {
              if (orderConfirmation) return;
              const item = cart.find(i => i.id === id);
              if (!item) return;
              const newQty = item.quantity + delta;
              if (newQty < 1) return;
              item.quantity = newQty;
              render();
            },
            setName(val) {
              customerName = val;
              if (val.trim()) {
                delete errors.name;
              }
            },
            placeOrder(e) {
              e.preventDefault();
              if (orderConfirmation || isSubmitting) return;
              isSubmitting = true;

              const validationErrors = {};
              const trimmed = customerName.trim();
              if (cart.length === 0) {
                validationErrors.cart = 'Your cart is empty. Please add at least one product to proceed.';
              }
              if (!trimmed) {
                validationErrors.name = 'Please enter your customer name.';
              }

              if (Object.keys(validationErrors).length > 0) {
                errors = validationErrors;
                isSubmitting = false;
                render();
                return;
              }

              errors = {};
              const timestamp = Date.now().toString(36).toUpperCase();
              const randomPart = Math.random().toString(36).substring(2, 6).toUpperCase();
              const ref = 'ORD-' + timestamp + '-' + randomPart;

              orderConfirmation = {
                reference: ref,
                customerName: trimmed,
                items: cart.map(i => ({ ...i })),
                total: cart.reduce((sum, i) => sum + i.price * i.quantity, 0),
                placedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
              };

              isSubmitting = false;
              render();
            }
          };

          document.addEventListener('DOMContentLoaded', render);
          if (document.readyState !== 'loading') render();
        })();
      }
    </script>
